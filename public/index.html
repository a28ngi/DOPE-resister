<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B080C">
<script>try{var t=JSON.parse(localStorage.getItem('dopepos:theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DOPE POS">
<title>DOPE POS</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-180.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body data-view="register">
<div class="shell">
  <header class="bar">
    <img class="logo" src="/logo.webp" alt="DOPE" width="640" height="218">
    <button type="button" class="sync" id="sync" data-s="idle" aria-live="polite"><i></i><span>接続中</span></button>
    <nav class="nav" aria-label="画面">
      <a href="#register" data-view="register">レジ</a>
      <a href="#history" data-view="history">履歴</a>
      <a href="#stats" data-view="stats">集計</a>
      <a href="#close" data-view="close">レジ締め</a>
      <a href="#settings" data-view="settings">設定</a>
    </nav>
  </header>

  <main>
    <!-- レジ -->
    <section class="view register" id="v-register" aria-label="レジ">
      <div class="menu" id="menu"></div>
      <aside class="ticket-panel" id="cart" aria-label="ご注文"></aside>
    </section>

    <!-- 履歴 -->
    <section class="view" id="v-history" aria-label="履歴" hidden>
      <div class="toolbar">
        <div class="chips" id="historyDays" role="group" aria-label="日付"></div>
        <label class="search"><span class="sr">検索</span><input id="historyQuery" type="search" placeholder="金額・商品名で絞り込み" autocomplete="off"></label>
      </div>
      <div id="historyList"></div>
    </section>

    <!-- 集計 -->
    <section class="view" id="v-stats" aria-label="集計" hidden>
      <div class="chips" id="statsDays" role="group" aria-label="集計する日"></div>
      <div id="statsBody"></div>
    </section>

    <!-- レジ締め -->
    <section class="view" id="v-close" aria-label="レジ締め" hidden>
      <div id="closeBody"></div>
    </section>

    <!-- 設定 -->
    <section class="view" id="v-settings" aria-label="設定" hidden>
      <div id="settingsBody"></div>
    </section>
  </main>
</div>

<!-- スマホ・縦向きタブレットのお会計シート -->
<div class="pay-sheet" id="paySheet" hidden></div>

<!-- 会計後の画面：お釣りと渡すものを大きく出す -->
<div class="done" id="done" hidden role="dialog" aria-modal="true" aria-labelledby="doneTitle"></div>

<!-- 確認・入力ダイアログ -->
<dialog class="sheet" id="sheet"></dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>

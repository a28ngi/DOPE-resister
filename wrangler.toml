name = "dope-register"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 自分の Cloudflare で使うときは、`npx wrangler d1 create dope-register` で作った ID に書き換える
[[d1_databases]]
binding = "DB"
database_name = "dope-register"
database_id = "63a65faa-4562-44f4-adf5-621fa0bf2d0b"
